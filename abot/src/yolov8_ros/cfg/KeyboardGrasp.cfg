#!/usr/bin/env python

# 配置文件，用于定义可动态调整的参数
# 这个文件让我们能够通过rqt_reconfigure界面实时调整机械臂的控制参数

PACKAGE = "yolov8_ros"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 机械臂位置控制参数
gen.add("kms_x", double_t, 0, "机械臂X坐标 (毫米)", 0, -300, 300)
gen.add("kms_y", double_t, 0, "机械臂Y坐标 (毫米)", 150, 50, 400)
gen.add("kms_z", double_t, 0, "机械臂Z高度 (毫米)", 10, 0, 200)

# 舵机控制参数
gen.add("servo_yuntai", int_t, 0, "云台舵机PWM值", 1500, 500, 2500)
gen.add("servo_zhuazi", int_t, 0, "爪子舵机PWM值", 1500, 500, 2500)

# 运动时间参数
gen.add("move_time", int_t, 0, "运动时间 (毫秒)", 2000, 500, 5000)

# 动作触发器
gen.add("trigger_action", bool_t, 0, "触发抓取动作", False)
gen.add("reset_position", bool_t, 0, "重置到初始位置", False)

# 爪子控制
gen.add("gripper_open", bool_t, 0, "张开爪子", False)
gen.add("gripper_close", bool_t, 0, "闭合爪子", False)

# 调试模式
gen.add("debug_mode", bool_t, 0, "调试模式", False)

exit(gen.generate(PACKAGE, "keyboard_grasp", "KeyboardGrasp"))